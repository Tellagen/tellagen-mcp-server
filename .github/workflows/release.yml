name: Release

# A tag v<version> on a commit of master publishes that version to npm with
# provenance and creates a GitHub release that holds the changelog section of
# the version.
#
# Before the first release, one of these must be set up for the repository:
#   - npm trusted publishing for this workflow file (no secret needed), or
#   - the repository secret NPM_TOKEN with an npm automation token.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that runs code from the dependencies runs here, with no right
  # to publish.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tagged commit is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "The tagged commit is not on master. Tag a commit of master." >&2
            exit 1
          fi
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version." >&2
            exit 1
          fi
      - name: The changelog has a dated section for the version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs --release "$TAG" > /dev/null
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: The built server starts with no key and lists its tools
        run: node scripts/smoke.mjs

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance and trusted publishing
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than Node 22 brings.
      - name: Update npm
        run: npm install --global npm@^11.5.1
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs --release "$TAG" > "$RUNNER_TEMP/release-notes.md"
      # No install script of a dependency runs in the job that can publish.
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Publish with the token
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --ignore-scripts
      - name: Publish with trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish --provenance --access public --ignore-scripts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
